<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <clipPath id="inner">
      <polygon points="110,26 194,150 110,274 26,150"/>
    </clipPath>
  </defs>
  <!-- outer chrome frame -->
  <polygon points="110,8 212,150 110,292 8,150" fill="#111111"/>
  <!-- inner light field -->
  <polygon points="110,26 194,150 110,274 26,150" fill="#ffffff"/>
  <!-- checkered quarters (clipped to inner) -->
  <g clip-path="url(#inner)">
    <polygon points="110,26 110,150 26,150" fill="#111111"/>
    <polygon points="110,150 194,150 110,274" fill="#111111"/>
    <!-- cross -->
    <rect x="104" y="26" width="12" height="248" fill="#111111"/>
    <rect x="26" y="144" width="168" height="12" fill="#111111"/>
    <!-- nameplate (inside inner diamond only — no notches in outer frame) -->
    <rect x="34" y="130" width="152" height="40" rx="2" fill="#111111"/>
  </g>
  <text x="110" y="157" text-anchor="middle"
        font-family="Arial Black, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="700" letter-spacing="1.8" fill="#ffffff">BORGWARD</text>
</svg>
